name: Verify poster production build
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Vite production bundle
        run: npm run build
      - name: Install browser regression dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 pngjs@7.0.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify preview and PNG export match
        run: node scripts/verify-poster-export.mjs
